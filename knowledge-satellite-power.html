<h1>衛星飛進陰影時，靠什麼供電？</h1>
<p class="article-summary">陽光被地球遮住後，看看衛星怎麼讓儀器繼續運作。</p>
</div>
<figure class="article-figure">
<img src="assets/article-satellite.png" alt="地球軌道上展開太陽能板的衛星">
<figcaption>封面情境插圖 · ImageGen</figcaption>
</figure>
<div class="article-body">
<p class="detail-reveal">許多繞地球運行的衛星用太陽能板把陽光轉成電力，也用這些電力為電池充電。當衛星飛進地球的陰影，太陽能板暫時收不到直射陽光，電池就能接手供電。</p>
<p class="detail-reveal">工程師會把陰影可能持續的時間納入設計。電池儲存的電量、儀器用電和充電時間，都會影響衛星能做多少工作。</p>
<p class="detail-reveal source"><a href="https://spaceplace.nasa.gov/what-powers-a-spacecraft/en/">NASA Space Place｜太空船的電力從哪來？ ↗</a></p>
</div>
