<h1>月亮為什麼會變形？</h1>
<p class="article-summary">從月牙到滿月，為什麼同一顆月球會有這麼多種樣子？</p>
</div>
<figure class="article-figure">
<img src="assets/article-moon.png" alt="右側被陽光照亮的月牙">
<figcaption>封面情境插圖 · ImageGen</figcaption>
</figure>
<div class="article-body">
<p class="detail-reveal">月球本身不發光。我們看到的月光是月面反射的陽光。月球繞著地球移動時，我們看得到的亮面比例也跟著改變，於是從地球看見不同月相。</p>
<p class="detail-reveal">滿月時，我們看到的那一面幾乎全亮。弦月看起來像半個圓，因為從地球只能看到朝向我們的那一面有一半被照亮。平常的月相變化是觀看角度造成的，地球的影子遮到月球則是月食。</p>
<p class="detail-reveal source"><a href="https://science.nasa.gov/moon/top-moon-questions/">NASA Science｜月球常見問題 ↗</a></p>
</div>
